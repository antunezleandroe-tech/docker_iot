<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <title>FLASK CRUD 1.6</title>
  <link id="theme-stylesheet" rel="stylesheet" href="https://bootswatch.com/5/cosmo/bootstrap.min.css"> 
</head>

<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">CRUD</a>
      
      {% if session.get("user_id") %}
      <div class="d-flex align-items-center">
        <div class="nav-item pe-3">
            <select id="selectorTema" class="form-select form-select-sm">
                <option value="cosmo">Tema Claro</option>
                <option value="darkly">Tema Oscuro</option>
            </select>
        </div>

        <div class="nav-item pe-3 text-light">{{ session.get("user_id") }}</div>
        <a href="{{url_for('logout')}}" class="btn btn-secondary btn-sm my-2 my-sm-0" type="submit">Salir</a>
      </div>
      {% endif %}
      
    </div>
  </nav>

  <div class="container pt-4">
    {% with messages = get_flashed_messages() %} 
      {% if messages %}
        {% for message in messages %}
        <div class="alert alert-success alert-dismissible fade show" role="alert">
          <strong>{{ message }}</strong>
          <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        {% endfor %}
      {% endif %} 
    {% endwith %}

    {% block body %}
    {% endblock %}
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" 
          integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO" 
          crossorigin="anonymous"></script>

  <script src="{{url_for('static', filename='js/main.js')}}"></script>
</body>
</html>
